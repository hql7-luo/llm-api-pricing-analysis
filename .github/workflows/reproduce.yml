name: Reproduce analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the pinned analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Download the pinned Kaggle snapshot
        run: python src/download_data.py
      - name: Reproduce models and generate held-out predictions
        run: python src/run_analysis.py
      - name: Independently check inputs, folds, medians and errors
        run: python src/check_results.py
      - name: Check bilingual summaries are one page each
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          for path in [Path('outputs/summary_en.pdf'), Path('outputs/summary_zh.pdf')]:
              assert len(PdfReader(path).pages) == 1, str(path)
              assert PdfReader(path).pages[0].extract_text().strip(), str(path)
          PY
